name: Apply source ZIP

# Upload pes2017-nx-src.zip to the repository root: this unpacks it over the
# tree (keeping ppc/ and .github/), removes the ZIP and commits the result.
# The Switch build (build-nro.yml) then starts on its own.
on:
  push:
    paths:
      - "pes2017-nx-src.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-source
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Unpack source over the tree
        shell: bash
        run: |
          set -euo pipefail
          test -s pes2017-nx-src.zip
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import shutil, stat

          archive = Path("pes2017-nx-src.zip")
          root = Path(".").resolve()
          keep = {".git", ".github", "ppc", "pes2017-nx-src.zip"}
          with ZipFile(archive) as z:
              infos = [i for i in z.infolist() if i.filename.strip("/")]
              parts = [PurePosixPath(i.filename).parts for i in infos]
              tops = {p[0] for p in parts}
              strip = len(tops) == 1 and all(len(p) > 1 or i.is_dir() for p, i in zip(parts, infos))
              names = set()
              for info in infos:
                  raw = PurePosixPath(info.filename)
                  if raw.is_absolute() or ".." in raw.parts:
                      raise SystemExit(f"unsafe path: {info.filename}")
                  rel = PurePosixPath(*raw.parts[1:]) if strip else raw
                  if not rel.parts or rel.parts[0] in keep:
                      continue
                  names.add(rel.parts[0])
              # Replace every top-level entry the archive brings, plus the old
              # Android tree, so files deleted upstream do not linger.
              for top in names | {"pes2017-recomp-main", "pes2017-recomp-main.zip"}:
                  path = root / top
                  if path.is_dir() and not path.is_symlink():
                      shutil.rmtree(path)
                  elif path.exists() or path.is_symlink():
                      path.unlink()
              count = 0
              for info in infos:
                  raw = PurePosixPath(info.filename)
                  rel = PurePosixPath(*raw.parts[1:]) if strip else raw
                  if not rel.parts or rel.parts[0] in keep:
                      continue
                  target = root.joinpath(*rel.parts)
                  if root not in target.resolve().parents:
                      raise SystemExit(f"escapes the tree: {info.filename}")
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  if stat.S_ISLNK((info.external_attr >> 16) & 0xFFFF):
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as src, target.open("wb") as dst:
                      shutil.copyfileobj(src, dst, 1 << 20)
                  mode = (info.external_attr >> 16) & 0o777
                  if mode & 0o111:
                      target.chmod(0o755)
                  count += 1
          print(f"unpacked {count} files into {sorted(names)}")
          PY
          git rm -q --cached pes2017-nx-src.zip
          rm -f pes2017-nx-src.zip

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -q -m "Apply pes2017-nx-src.zip"
          git push origin HEAD:main
